name: Publish RudderStack Transformations

on:
  pull_request:
    branches:
      - main
    paths:
      - rudderstack/**
      - '!rudderstack/**/*.md'
      - .github/workflows/publish-rudderstack-transformations.yml
  push:
    branches:
      - main
    paths:
      - rudderstack/**
      - '!rudderstack/**/*.md'
      - .github/workflows/publish-rudderstack-transformations.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TEST_ONLY: ${{ github.event_name != 'push' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          ref: ${{ github.ref }}

      - name: Rudder Transformation Action
        uses: rudderlabs/rudder-transformation-action@7355ce0d2809929ec581b254e9f9c61a41f6c206 # 1.1.0
        with:
          metaPath: './rudderstack/transformations/meta.json'
          email: not.a.real.person@example.com
          accessToken: ${{ secrets.RUDDERSTACK_TRANSFORMATIONS }}
          uploadTestArtifact: false
